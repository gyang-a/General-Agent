[project]
name = "chat-backend"
version = "0.1.0"
description = "FastAPI + LangChain backend compatible with the existing chat frontend."
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi[standard]>=0.125.0",
  "uvicorn[standard]>=0.38.0",
  "python-multipart>=0.0.20",
  "motor>=3.7.1,<3.8.0",
  "pymongo>=4.15.0",
  "pydantic-settings>=2.12.0",
  "langchain>=1.0.0",
  "langchain-mcp-adapters>=0.1.0",
  "langchain-openai>=1.0.0",
  "langgraph>=1.0.0",
  "langgraph-checkpoint-mongodb>=0.2.0",
  "httpx>=0.28.0",
]

[dependency-groups]
dev = [
  "ruff>=0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
